spring.application.name=skill-sharing-platform-backend
# DB Config
spring.datasource.url=jdbc:mysql://localhost:3306/skill_sharing_platform
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server
server.port=8080

endpoints.cors.allowed-origins=http://localhost:3000
endpoints.cors.allowed-methods=GET,POST,PUT,DELETE
endpoints.cors.allowed-headers=*

# Better Hibernate logging
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# Temporary wider CORS settings for debugging
endpoints.cors.allowed-origins=*
endpoints.cors.allowed-methods=*
endpoints.cors.allowed-headers=*
